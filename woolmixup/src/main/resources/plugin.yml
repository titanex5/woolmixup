name: WoolMixUp
version: '1.0.0'
main: pl.twojserwer.woolmixup.WoolMixUpPlugin
api-version: '1.21'
author: TwojServer
description: Minigra solo w stylu "Wool Mix Up" - biegnij na poprawny kolor welny zanim reszta zniknie.

commands:
  woolmixup:
    aliases: [wmu]
    description: Zarzadzanie i granie w WoolMixUp
    usage: /woolmixup <setup|start|stop|best> [nazwa] [rozmiar]
    permission: woolmixup.play

permissions:
  woolmixup.play:
    description: Pozwala grac w WoolMixUp
    default: true
  woolmixup.admin:
    description: Pozwala tworzyc/usuwac areny WoolMixUp
    default: op
