# === WoolMixUp - konfiguracja ===

game:
  # Ile sekund ma gracz na pierwsza runde.
  base-time-seconds: 5.0

  # Dolny limit czasu - ponizej tego runda juz sie nie skraca.
  min-time-seconds: 1.3

  # O ile sekund skraca sie czas kazdej kolejnej rundy.
  time-decrease-per-round: 0.15

  # Krotka przerwa (sekundy) miedzy rundami, zeby gracz zdazyl zobaczyc nowy kolor
  # i plansza zdazyla sie zregenerowac, zanim odliczanie ruszy na dobre.
  countdown-before-round-seconds: 1.2

  # Ile bloczkow ponizej poziomu podlogi uznajemy juz za "spadniecie" (koniec gry).
  fall-threshold-blocks: 2

  # Rozmiar boku pojedynczego "kafla" koloru (blokow x blokow). Domyslnie 3
  # oznacza, ze kazdy kolor zajmuje kwadrat 3x3, a nie pojedynczy blok - latwiej
  # dostrzec i dobiec, plansza wyglada bardziej jak w oryginalnej minigrze.
  cell-size: 3

  # Pula kolorow welny uzywanych w grze. Mozesz dodac/usunac kolory z listy
  # ponizej (nazwy materialow Bukkit bez sufiksu _WOOL).
  colors:
    - WHITE
    - ORANGE
    - MAGENTA
    - LIGHT_BLUE
    - YELLOW
    - LIME
    - PINK
    - CYAN
    - PURPLE
    - RED

settings:
  debug: false
