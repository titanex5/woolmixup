name: Build WoolMixUp jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Zainstaluj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'

      - name: Debug - pokaz strukture repo
        run: |
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          pwd
          find . -maxdepth 3 -not -path '*/.git*'

      - name: Zbuduj (gradle jar)
        run: gradle jar --no-daemon

      - name: Wystaw jar jako artefakt do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: WoolMixUp-jar
          path: build/libs/WoolMixUp-*.jar
