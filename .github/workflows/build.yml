name: Build WoolMixUp jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Zainstaluj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'

      - name: Znajdz folder z projektem Gradle
        id: find_project
        run: |
          DIR=$(dirname "$(find . -name 'settings.gradle.kts' -not -path '*/.git/*' | head -n 1)")
          if [ -z "$DIR" ]; then
            echo "Nie znaleziono settings.gradle.kts w repo!"
            find . -maxdepth 4 -not -path '*/.git*'
            exit 1
          fi
          echo "Znaleziono projekt w: $DIR"
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Zbuduj (gradle jar)
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: gradle jar --no-daemon

      - name: Wystaw jar jako artefakt do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: WoolMixUp-jar
          path: ${{ steps.find_project.outputs.project_dir }}/build/libs/WoolMixUp-*.jar
